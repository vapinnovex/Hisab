[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hishob-windows-connector"
version = "0.1.0"
description = "Isolated RadioSoft synthetic-preview Windows connector"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "jsonschema==4.25.1", "pywin32==311; sys_platform == 'win32'"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]
test = ["pytest==8.4.2", "ruff==0.16.8"]
local-probe = ["pyodbc==5.2.0"]

[tool.setuptools.package-data]
hishob_connector = ["observation.schema.json"]

[tool.setuptools.packages.find]
include = ["hishob_connector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../backend"]
markers = ["integration: requires an isolated loopback MongoDB", "windows: Windows API test"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
