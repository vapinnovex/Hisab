name: CI checks
on:
  push:
  pull_request:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
      TEST_MONGODB_URI: mongodb://127.0.0.1:27018
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock.txt -r requirements-dev.txt
          .venv/bin/python -m pip check
      - name: Backend lint and formatting
        working-directory: backend
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Backend tests
        working-directory: backend
        run: .venv/bin/pytest -q
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Deployment configuration regression tests
        working-directory: mobile
        run: npm run test:deployment
      - name: Mobile typecheck
        working-directory: mobile
        run: npm run typecheck
      - name: Mobile lint and formatting
        working-directory: mobile
        run: |
          npm run lint
          npm run format:check
      - name: Expo dependency checks
        working-directory: mobile
        run: npx expo-doctor
      - name: Export native bundles
        working-directory: mobile
        run: npx expo export --platform ios --platform android --output-dir dist/native
      - name: Build web app and PWA shell
        working-directory: mobile
        run: npm run build:web
      - name: Install test browser
        working-directory: mobile
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: mobile
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: mobile/test-results/
