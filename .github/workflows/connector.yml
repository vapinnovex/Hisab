name: Windows connector preview checks
on:
  push:
    paths: ['connector/**', 'backend/**', 'docs/radiosoft*', 'docs/radiosoft*/**', '.github/workflows/connector.yml']
  pull_request:
    paths: ['connector/**', 'backend/**', 'docs/radiosoft*', 'docs/radiosoft*/**', '.github/workflows/connector.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: connector-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7.0.16
        ports: ['27189:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CONNECTOR_TEST_MONGODB_URI: mongodb://127.0.0.1:27189
      TEST_MONGODB_URI: mongodb://127.0.0.1:27189
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r backend/requirements.lock.txt -r backend/requirements-dev.txt -e 'connector[test]'
      - run: python -m pip check
      - run: python -m ruff check connector
      - run: python -m ruff format --check connector
      - name: Connector contract and isolated API integration
        run: python -m pytest -c connector/pyproject.toml connector/tests -q -ra
      - name: Backend collection and isolation regressions
        working-directory: backend
        run: python -m pytest tests/test_radiosoft.py tests/test_radiosoft_real.py tests/test_financial_reliability.py tests/test_cashbook_modes.py tests/test_dues.py tests/test_hishob.py -q
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.10', architecture: x64}
      - run: python -m pip install -r connector/windows/requirements-build.lock
      - run: python -m pip install --no-deps --no-build-isolation -e connector
      # Schema contracts use Pydantic; TLS tests use cryptography (backend lock versions).
      - run: python -m pip install pytest==8.4.2 pydantic==2.13.5 cryptography==46.0.7
      - run: python -m pip check
      - name: Windows DPAPI, process recovery and source unit tests (no SQL or service install)
        run: python -m pytest -c connector/pyproject.toml connector/tests -m 'not integration' -q -ra
      - name: Upgrade service account SID regression (no service changes)
        shell: powershell
        run: ./connector/tests/Test-UpgradeDevAccount.ps1
      - name: Parse Windows scripts without executing installers
        shell: pwsh
        run: |
          Get-ChildItem connector/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - shell: pwsh
        run: ./connector/windows/Build-Release.ps1 -Python (Get-Command python).Source
      - shell: pwsh
        run: ./connector/windows/Build-Release.ps1 -Python (Get-Command python).Source -RealDev
      - name: Record package checksums
        shell: pwsh
        run: |
          Get-ChildItem connector/dist/*.zip | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content connector/dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-preview-windows-packages
          path: |
            connector/dist/*.zip
            connector/dist/SHA256SUMS.txt
          retention-days: 7
